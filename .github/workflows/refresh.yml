name: refresh cache (manual only)

# Background refreshes are owned by the in-process scheduler in
# src/instrumentation.ts — same pattern SeaDisco uses. This workflow is
# kept as a manual escape hatch via workflow_dispatch only; if the
# inline scheduler dies you can fire any bucket from the Actions UI.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: 'Bucket to run'
        required: true
        default: 'all'
        type: choice
        options: [1m, 2m, 5m, 15m, 1h, 4h, 12h, all]

permissions:
  contents: read

env:
  SITE: https://mtz.city

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit cron endpoint
        run: |
          set -e
          b="${{ github.event.inputs.bucket }}"
          echo ">>> bucket=$b"
          curl -sS -fL --max-time 120 "$SITE/api/cron?bucket=$b"
          echo
