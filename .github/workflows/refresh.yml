name: refresh cache

# Hits /api/cron on the deployed site at the cadences listed below.
# GitHub schedules drift by a couple of minutes; that's fine for this site.
#
# IMPORTANT: GitHub Actions floors cron schedules at 5 minutes. The
# 1m and 2m buckets are defined in code for true-1-min freshness, but
# this workflow can only fire them every 5 min. For real 1-min cadence,
# point an external pinger (e.g. cron-job.org) at:
#   https://mtz.city/api/cron?bucket=1m   — every 1 minute
#   https://mtz.city/api/cron?bucket=2m   — every 2 minutes
#
# Schedule (UTC):
#   */5  * * * *   — 1m + 2m + 5m buckets (current wx, AQI, alerts, stocks)
#   */15 * * * *   — 15m bucket (buoys)
#   0    * * * *   — 1h bucket  (forecasts, marine, eBird, USGS)
#   0 */4 * * *    — 4h bucket  (news RSS, water RSS, weather story imagery)
#   0 */12 * * *   — 12h bucket (Foursquare places, Ticketmaster events)

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '*/15 * * * *'
    - cron: '0 * * * *'
    - cron: '0 */4 * * *'
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      bucket:
        description: 'Bucket to run'
        required: true
        default: 'all'
        type: choice
        options: [1m, 2m, 5m, 15m, 1h, 4h, 12h, all]

permissions:
  contents: read

env:
  SITE: https://mtz.city

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pick buckets for this run
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "*/5 * * * *")  echo "buckets=1m 2m 5m" >> "$GITHUB_OUTPUT" ;;
            "*/15 * * * *") echo "buckets=15m"      >> "$GITHUB_OUTPUT" ;;
            "0 * * * *")    echo "buckets=1h"       >> "$GITHUB_OUTPUT" ;;
            "0 */4 * * *")  echo "buckets=4h"       >> "$GITHUB_OUTPUT" ;;
            "0 */12 * * *") echo "buckets=12h"      >> "$GITHUB_OUTPUT" ;;
            *)              echo "buckets=${{ github.event.inputs.bucket || 'all' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Hit cron endpoint
        run: |
          set -e
          for b in ${{ steps.pick.outputs.buckets }}; do
            echo ">>> bucket=$b"
            curl -sS -fL --max-time 120 "$SITE/api/cron?bucket=$b"
            echo
          done
